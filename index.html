<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iMuse — Personal Cultural Universe</title>
    <meta name="description" content="Your personal universe of things worth remembering." />
    <meta property="og:title" content="iMuse" />
    <meta property="og:description" content="Your personal universe of things worth remembering." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts Preconnect & Async Stylesheet (Non-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Rajdhani:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Rajdhani:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Rajdhani:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Base Styling & Instant Shell Layout (0ms paint) -->
    <style>
      :root {
        --color-background: #09090b;
        --color-text: #f4f4f5;
        --bg-base: #09090b;
        --text-primary: #f4f4f5;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--color-background);
        color: var(--color-text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        overflow-x: hidden;
      }
      .imuse-shell-boot {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background-color: #09090b;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 1.5rem;
        box-sizing: border-box;
        z-index: 1;
        overflow: hidden;
      }
      @media (min-width: 768px) {
        .imuse-shell-boot {
          padding: 3rem;
        }
      }
      .imuse-shell-backdrop {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 65% 35%, rgba(140, 135, 125, 0.35) 0%, rgba(85, 80, 75, 0.2) 40%, #181614 100%);
        pointer-events: none;
      }
      .imuse-shell-grid {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.15) 1px, transparent 1px);
        background-size: 40px 40px;
        opacity: 0.07;
        pointer-events: none;
      }
      .imuse-shell-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        position: relative;
        z-index: 2;
      }
      .imuse-shell-logo {
        font-family: "Playfair Display", Georgia, serif;
        font-size: 1.125rem;
        font-weight: 500;
        letter-spacing: 0.05em;
        color: rgba(255, 255, 255, 0.9);
      }
      .imuse-shell-action {
        font-size: 0.6875rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.7);
        display: flex;
        align-items: center;
        gap: 0.5rem;
        text-decoration: none;
      }
      .imuse-shell-footer {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        width: 100%;
        position: relative;
        z-index: 2;
        padding-left: 0.5rem;
        padding-bottom: 0.5rem;
      }
      .imuse-shell-caption {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        max-width: 32rem;
      }
      .imuse-shell-category {
        font-size: 0.6875rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.9);
      }
      .imuse-shell-title {
        font-size: 1.5rem;
        font-weight: 300;
        letter-spacing: 0.025em;
        color: #ffffff;
        margin: 0;
      }
      @media (min-width: 768px) {
        .imuse-shell-title {
          font-size: 1.75rem;
        }
      }
      .imuse-shell-desc {
        font-size: 0.8125rem;
        font-weight: 300;
        color: rgba(255, 255, 255, 0.7);
        margin: 0;
      }
      .imuse-shell-indicator {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .imuse-shell-counter {
        font-size: 0.625rem;
        font-family: monospace;
        letter-spacing: 0.25em;
        color: rgba(255, 255, 255, 0.5);
      }
      .imuse-shell-dots {
        display: flex;
        gap: 0.375rem;
        align-items: center;
      }
      .imuse-shell-dot {
        width: 0.375rem;
        height: 0.25rem;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.3);
      }
      .imuse-shell-dot.active {
        width: 1.5rem;
        background: #ffffff;
      }
    </style>

    <!-- Zero-Flash Theme & Typography Pre-Hydration -->
    <script>
      (function() {
        try {
          var state = localStorage.getItem('imuse-settings');
          var appearance = 'default';
          var typography = 'neutral';
          var shape = 'rounded';
          var density = 'balanced';
          var nav = 'floating';
          var customPalettes = [];
          
          if (state) {
            var parsed = JSON.parse(state);
            if (parsed && parsed.state) {
              if (parsed.state.appearance) appearance = parsed.state.appearance;
              if (parsed.state.typography) typography = parsed.state.typography;
              if (parsed.state.shapeLanguage) shape = parsed.state.shapeLanguage;
              if (parsed.state.feedDensity) density = parsed.state.feedDensity;
              if (parsed.state.navStyle) nav = parsed.state.navStyle;
              if (parsed.state.customPalettes) customPalettes = parsed.state.customPalettes;
            }
          }

          var lightThemeMap = {
            'swiss-international': { bg: '#FFFFFF', text: '#111111' },
            'art-book': { bg: '#F8F5EE', text: '#1A1816' },
            'modernist': { bg: '#F4F5F6', text: '#12151A' },
            'neo-romantic': { bg: '#FDF6F6', text: '#2A1B22' },
            'analog-archive': { bg: '#EBE4D5', text: '#2E2721' },
            'botanical': { bg: '#F4F4EB', text: '#1D231C' },
            'terracotta': { bg: '#F5ECE1', text: '#2B1D14' },
            'alpine': { bg: '#F0F4F8', text: '#101826' },
            'desert-dusk': { bg: '#F7EFE9', text: '#281B24' },
            'prismatic': { bg: '#F7F7FA', text: '#181820' },
            'paper': { bg: '#F4EEDD', text: '#2C2A26' },
            'ivory': { bg: '#FFFFF0', text: '#4A4A4A' },
            'sand': { bg: '#F5F2EB', text: '#2C2824' },
            'concrete': { bg: '#EFEFEF', text: '#2B2B2B' },
            'ash': { bg: '#ECEBE8', text: '#383A35' },
            'monochrome': { bg: '#FFFFFF', text: '#000000' },
            'default': { bg: '#FDFCFB', text: '#111111' }
          };

          var isDark = true;
          var customBg = null;
          var customText = null;

          if (appearance === 'default') {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (!isDark) {
              customBg = lightThemeMap.default.bg;
              customText = lightThemeMap.default.text;
            }
          } else if (lightThemeMap[appearance]) {
            isDark = false;
            customBg = lightThemeMap[appearance].bg;
            customText = lightThemeMap[appearance].text;
          } else if (customPalettes && customPalettes.length) {
            var custom = customPalettes.find(function(p) { return p.id === appearance; });
            if (custom) {
              isDark = !!custom.isDark;
              if (custom.tokens) {
                customBg = custom.tokens.background;
                customText = custom.tokens.text;
              }
            }
          }

          var root = document.documentElement;
          root.classList.add(isDark ? 'dark' : 'light');
          root.classList.add('theme-' + appearance);
          root.classList.add('typo-' + typography);
          root.classList.add('shape-' + shape);
          root.classList.add('density-' + density);
          root.classList.add('nav-' + nav);

          if (customBg) {
            root.style.setProperty('--color-background', customBg);
            root.style.setProperty('--bg-base', customBg);
          }
          if (customText) {
            root.style.setProperty('--color-text', customText);
            root.style.setProperty('--text-primary', customText);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Instant App Shell displayed until React hydrates -->
      <div class="imuse-shell-boot" id="boot-shell">
        <div class="imuse-shell-backdrop"></div>
        <div class="imuse-shell-grid"></div>
        <div class="imuse-shell-header">
          <div class="imuse-shell-logo">IMuse</div>
          <a href="/home" class="imuse-shell-action">
            <span>Enter IMuse</span>
            <span>→</span>
          </a>
        </div>
        <div class="imuse-shell-footer">
          <div class="imuse-shell-caption">
            <div class="imuse-shell-category">Architecture</div>
            <h2 class="imuse-shell-title">The Brutalist Monolith</h2>
            <p class="imuse-shell-desc">A study in concrete textures and dramatic light casting.</p>
          </div>
          <div class="imuse-shell-indicator">
            <span class="imuse-shell-counter">01 / 10</span>
            <div class="imuse-shell-dots">
              <span class="imuse-shell-dot active"></span>
              <span class="imuse-shell-dot"></span>
              <span class="imuse-shell-dot"></span>
              <span class="imuse-shell-dot"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
