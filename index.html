<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iMuse — Personal Cultural Universe</title>
    <meta name="description" content="Your personal universe of things worth remembering." />
    <meta property="og:title" content="iMuse" />
    <meta property="og:description" content="Your personal universe of things worth remembering." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts Preconnect & Async Stylesheet (Non-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Rajdhani:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Rajdhani:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Rajdhani:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Base Styling & Instant Shell Layout (0ms paint) -->
    <style>
      :root {
        --color-background: #09090b;
        --color-text: #f4f4f5;
        --bg-base: #09090b;
        --text-primary: #f4f4f5;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--color-background);
        color: var(--color-text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        overflow-x: hidden;
      }
      .imuse-shell-boot {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background-color: var(--color-background);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 1.5rem;
        box-sizing: border-box;
        z-index: 1;
        pointer-events: none;
      }
      @media (min-width: 768px) {
        .imuse-shell-boot {
          padding: 3rem;
        }
      }
      .imuse-shell-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
      }
      .imuse-shell-logo {
        font-family: "Playfair Display", Georgia, serif;
        font-size: 1.125rem;
        font-weight: 500;
        letter-spacing: 0.05em;
        color: rgba(255, 255, 255, 0.9);
      }
      .imuse-shell-action {
        font-size: 0.6875rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.7);
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .imuse-shell-ambient {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.04), transparent 70%);
        pointer-events: none;
      }
    </style>

    <!-- Zero-Flash Theme & Typography Pre-Hydration -->
    <script>
      (function() {
        try {
          var state = localStorage.getItem('imuse-settings');
          var appearance = 'default';
          var typography = 'neutral';
          var shape = 'rounded';
          var density = 'balanced';
          var nav = 'floating';
          var customPalettes = [];
          
          if (state) {
            var parsed = JSON.parse(state);
            if (parsed && parsed.state) {
              if (parsed.state.appearance) appearance = parsed.state.appearance;
              if (parsed.state.typography) typography = parsed.state.typography;
              if (parsed.state.shapeLanguage) shape = parsed.state.shapeLanguage;
              if (parsed.state.feedDensity) density = parsed.state.feedDensity;
              if (parsed.state.navStyle) nav = parsed.state.navStyle;
              if (parsed.state.customPalettes) customPalettes = parsed.state.customPalettes;
            }
          }

          var lightThemes = ['paper', 'ivory', 'sand', 'concrete', 'ash'];
          var isDark = true;
          
          if (appearance === 'default') {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          } else if (lightThemes.indexOf(appearance) !== -1) {
            isDark = false;
          } else if (customPalettes && customPalettes.length) {
            var custom = customPalettes.find(function(p) { return p.id === appearance; });
            if (custom) isDark = !!custom.isDark;
          }

          var root = document.documentElement;
          root.classList.add(isDark ? 'dark' : 'light');
          root.classList.add('theme-' + appearance);
          root.classList.add('typo-' + typography);
          root.classList.add('shape-' + shape);
          root.classList.add('density-' + density);
          root.classList.add('nav-' + nav);

          if (!isDark) {
            root.style.setProperty('--color-background', '#faf9f6');
            root.style.setProperty('--color-text', '#1c1917');
            root.style.setProperty('--bg-base', '#faf9f6');
            root.style.setProperty('--text-primary', '#1c1917');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Instant App Shell displayed until React hydrates -->
      <div class="imuse-shell-boot" id="boot-shell">
        <div class="imuse-shell-ambient"></div>
        <div class="imuse-shell-header">
          <div class="imuse-shell-logo">IMuse</div>
          <div class="imuse-shell-action">
            <span>Enter IMuse</span>
            <span>→</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
