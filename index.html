<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMuse</title>
    <meta name="description" content="Your personal universe of things worth remembering." />
    <meta property="og:title" content="IMuse" />
    <meta property="og:description" content="Your personal universe of things worth remembering." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <script>
      (function() {
        try {
          var state = localStorage.getItem('imuse-settings');
          if (state) {
            var parsed = JSON.parse(state);
            if (parsed && parsed.state && parsed.state.appearance) {
              var appearance = parsed.state.appearance;
              var isDark = false;
              var darkThemes = ['obsidian', 'midnight', 'graphite', 'electric', 'tron', 'monolith', 'observatory'];
              if (appearance === 'default') {
                isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
              } else {
                isDark = darkThemes.includes(appearance);
              }
              document.documentElement.classList.add(isDark ? 'dark' : 'light');
              document.documentElement.classList.add('theme-' + appearance);
            }
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
